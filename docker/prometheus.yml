global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'drl_system'
    static_configs:
      - targets: ['localhost:8000']
    scrape_interval: 5s

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['localhost:15672']

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
