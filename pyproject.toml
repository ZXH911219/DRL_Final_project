[project]
name = "multimodal-ppt-retrieval"
version = "0.1.0"
description = "次世代多模態 PPT 視覺與推理檢索系統（規格實作）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11,<2.14",
    "lancedb>=0.14",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "python-pptx>=0.6.21",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
    "watchdog>=4.0.0",
]
vision-ml = [
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "bitsandbytes>=0.43.0; platform_system != 'Windows'",
    "diffusers>=0.30.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
]
dev = [
    "pydantic-settings>=2.2.1",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
